# Nginx 反代：前端 3000，后端 4000
# 生产 HTTPS：按 README 第 6 步放证书后，取消下方 HTTPS server 块的注释
# 也可改用 Caddy 自动 HTTPS，见 README。
#
# 演示版受限预览（重要）：演示版 mock 支付不收真实款项就能标记成功并发货，
# 只能自己预览，不要公开。最简单的限制：在下面 server 块里取消 IP 白名单注释，
# 把 1.2.3.4 换成你自己的公网 IP，其他 IP 一律拒绝；同时不要在演示版里放真实卡密与真实密钥。
#   allow 1.2.3.4;
#   deny all;

server {
    listen 80;
    server_name _;

    # 健康检查
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # 前端
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

