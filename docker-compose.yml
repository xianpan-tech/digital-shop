services:
  db:
    image: postgres:16
    container_name: digital-shop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_db}
      POSTGRES_USER: ${POSTGRES_USER:-shop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # 演示版安全：不把数据库端口映射到宿主机，仅容器间内部网络访问。
    # 如本地调试确实需要直连数据库，再临时取消下面两行注释（仅绑定 127.0.0.1，不要暴露 0.0.0.0）：
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop_user} -d ${POSTGRES_DB:-shop_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: digital-shop-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me-redis-password} --appendonly yes
    volumes:
      - redisdata:/data
    # 演示版安全：不把 Redis 端口映射到宿主机，仅容器间内部网络访问。
    # 本地调试如需直连，临时取消下面注释（仅 127.0.0.1）：
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: digital-shop-backend
    env_file:
      - .env
    environment:
      PORT: 4000
      POSTGRES_HOST: db
    # 演示版安全：后端不直接映射到宿主机，统一经 Nginx 反代（/api/）访问。
    # 本地调试如需直连后端，临时取消下面注释（仅 127.0.0.1）：
    # ports:
    #   - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: digital-shop-frontend
    environment:
      # 前端 API 走相对路径 /api，经 Nginx 反代到后端，不要写死 localhost，否则访客浏览器会连访客自己的本机。
      NEXT_PUBLIC_API_URL: /api
    # 演示版安全：前端不直接映射到宿主机，统一经 Nginx（80/443）访问。
    # 本地调试如需直连前端，临时取消下面注释（仅 127.0.0.1）：
    # ports:
    #   - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: digital-shop-nginx
    # 唯一对外暴露的入口：只留 Nginx 80/443，其余服务均不映射宿主机端口。
    ports:
      - "80:80"
      # 生产 HTTPS 取消下一行注释，并按 README 第 6 步放证书
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
